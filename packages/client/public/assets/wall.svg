<svg width="33" height="268" viewBox="0 0 33 268" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main wall panel - professional office beige/gray -->
  <rect width="33" height="268" fill="#E8E5DC"/>

  <!-- Vertical panel grooves for office wall texture -->
  <line x1="11" y1="0" x2="11" y2="268" stroke="#D4CFC4" stroke-width="0.5"/>
  <line x1="22" y1="0" x2="22" y2="268" stroke="#D4CFC4" stroke-width="0.5"/>

  <!-- Subtle shadow on left edge for depth -->
  <rect x="0" y="0" width="2" height="268" fill="#D0CAB8" opacity="0.6"/>

  <!-- Subtle highlight on right edge -->
  <rect x="31" y="0" width="2" height="268" fill="#F5F3ED" opacity="0.4"/>

  <!-- Baseboard at bottom (darker) -->
  <rect y="258" width="33" height="10" fill="#9E9585"/>

  <!-- Baseboard highlight -->
  <rect y="258" width="33" height="1" fill="#BEBAB0"/>
</svg>
